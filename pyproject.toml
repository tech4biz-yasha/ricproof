[project]
name = "ricproof"
version = "0.2.0"
description = "ricproof: a conformance test suite that measures whether Open RAN RIC stores notice tampering (agmi method applied to the RAN Intelligent Controller)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yasha Khandelwal", email = "yasha.khandelwal@tech4biz.io"}]
maintainers = [{name = "Yasha Khandelwal", email = "yasha.khandelwal@tech4biz.io"}]
requires-python = ">=3.10"
keywords = ["o-ran", "ric", "near-rt-ric", "non-rt-ric", "sdl", "integrity", "security", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
# agmi 0.6.3 on PyPI does not carry T10 (erase_resurrect). Pinned to the
# agent-memory-integrity main commit that does, until the next agmi release.
dependencies = [
    "agent-memory-integrity @ git+https://github.com/tech4biz-yasha/agent-memory-integrity@e7fef1819e98b22345c94242bfa74e44afd3ff9c",
    "redis==4.3.6",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# ricsdl 3.1.2 pins hiredis==2.0.0, which does not build on Python 3.12.
# Install it without deps: pip install ricsdl==3.1.2 --no-deps
# (redis==4.3.6 above is the version ricsdl pins).

[project.scripts]
ricproof = "ricproof.runner:main"

[project.urls]
Repository = "https://github.com/tech4biz-yasha/ricproof"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ricproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Same rule set as agmi: correctness only.
select = ["E4", "E7", "E9", "F"]
